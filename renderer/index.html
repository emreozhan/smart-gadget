<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Smart Gadget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="logo">💡</span>
      <span data-i18n="appTitle">Smart Gadget</span>
    </div>
    <div id="topbarBtns" class="topbar-btns">
      <button id="langBtn" class="icon-btn" title=""></button>
      <button id="pinBtn" class="icon-btn" data-i18n-title="pin">📌</button>
      <button id="miniBtn" class="icon-btn" data-i18n-title="mini">▣</button>
      <button id="minBtn" class="icon-btn" data-i18n-title="minimize">–</button>
      <button id="closeBtn" class="icon-btn" data-i18n-title="hideToTray">✕</button>
    </div>
  </header>

  <main id="content">
    <!-- Cihaz yokken -->
    <section id="emptyState" class="empty hidden">
      <p data-i18n="noDevice">Ağda lamba bulunamadı.</p>
      <p class="hint" data-i18n="lanHint">Yeelight uygulamasından "LAN Kontrolü"nün açık olduğundan emin olun.</p>
      <button id="scanBtn" class="primary" data-i18n="scan">Ağı tara</button>
      <div class="manual-add">
        <input id="manualIp" type="text" placeholder="192.168.1.x">
        <button id="addIpBtn" data-i18n="addIp">IP ile ekle</button>
      </div>
      <p id="scanStatus" class="hint"></p>
    </section>

    <!-- Cihaz karti -->
    <section id="deviceView" class="hidden">
      <select id="miniDeviceSelect" class="mini-only" title=""></select>
      <div id="deviceTabs" class="device-tabs mini-hide"></div>
      <div class="device-header">
        <span id="connDot" class="dot"></span>
        <div class="device-meta">
          <div id="deviceName" class="device-name">—</div>
          <div id="deviceInfo" class="device-info">—</div>
        </div>
        <button id="rescanBtn" class="icon-btn" data-i18n-title="scan">🔄</button>
      </div>

      <button id="powerBtn" class="power-btn">
        <span class="power-icon">⏻</span>
        <span id="powerLabel" data-i18n="turnOn">Aç</span>
      </button>

      <div class="control mini-hide" id="ctRow">
        <label data-i18n="colorTemp">Beyaz tonu</label>
        <input id="ctSlider" type="range" min="1700" max="6500" step="100" value="4000">
      </div>

      <div class="control" id="brightRow">
        <label><span data-i18n="brightness">Parlaklık</span> <span id="brightVal">100%</span></label>
        <input id="brightSlider" type="range" min="1" max="100" value="100">
      </div>

      <div class="control mini-compact" id="colorRow">
        <label class="mini-hide" data-i18n="color">Renk</label>
        <div class="color-line">
          <input id="colorPicker" type="color" value="#ffcc4d">
          <div class="swatches mini-hide" id="swatches"></div>
        </div>
      </div>

      <span id="miniCtrls" class="mini-only"></span>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
